name: QA
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      # Unit tests deliberately do not install/download inference models.
      - run: python -m pip install numpy==2.4.4 sounddevice==0.5.5 torch==2.11.0
      - run: python -m unittest discover -s tests/unit -v
      - run: python -m compileall -q src/phase1_desktop
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/phase2_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
